<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box} body{margin:0;padding:18px;background:#f6f7f9;font:13px system-ui;color:#1f2328}
.grid{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.cell{background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.big img{display:block;width:160px;height:160px}
.small{display:flex;gap:8px;align-items:flex-end}
.small img{display:block}
.n{font-size:11px;color:#666;font-family:ui-monospace,monospace}
.dark{background:#1F2328;padding:16px;border-radius:14px;display:flex;gap:16px;align-items:center;margin-top:16px}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="big"><img src="badge.svg"></div>
    <div class="small">
      <img src="badge.svg" width="64" height="64"><img src="badge.svg" width="48" height="48">
      <img src="badge.svg" width="32" height="32"><img src="badge.svg" width="24" height="24">
      <img src="badge.svg" width="16" height="16">
    </div><div class="n">badge.svg</div></div>
  <div class="cell"><div class="big"><img src="badge-white.svg"></div>
    <div class="small">
      <img src="badge-white.svg" width="64" height="64"><img src="badge-white.svg" width="48" height="48">
      <img src="badge-white.svg" width="32" height="32"><img src="badge-white.svg" width="24" height="24">
      <img src="badge-white.svg" width="16" height="16">
    </div><div class="n">badge-white.svg</div></div>
</div>
<div class="dark"><span style="font-size:11px;color:#8A9099">深色底 badge-tile.svg：</span>
  <img src="badge-tile.svg" width="96" height="96">
  <img src="badge-tile.svg" width="48" height="48">
  <img src="badge-tile.svg" width="32" height="32">
  <img src="badge-tile.svg" width="24" height="24">
  <img src="badge-tile.svg" width="16" height="16">
</div>
</body></html>
