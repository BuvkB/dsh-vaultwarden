name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest
      - name: Install optional runtime dependency
        run: npm install --omit=dev --no-audit --no-fund
      - name: Syntax check
        run: for f in lib/*.js; do node --check "$f"; done
      - name: Publish (OIDC, tokenless)
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then
            # A release candidate must never become npm's `latest`; the
            # marketplace reads dist-tags.latest to decide whether to offer an
            # update, so publishing an rc as latest would push it to everyone.
            npm publish --tag rc
          else
            npm publish
          fi
